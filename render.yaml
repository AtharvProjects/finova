services:
  - type: web
    name: finova
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && cd client && npm install && cd .. && npm run build:client
    startCommand: npx tsx server/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ELEVENLABS_API_KEY
        sync: false
